services:
  # PostgreSQL - Main database
  postgres:
    image: postgres:15-alpine
    container_name: rideshare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rideshare_db
      POSTGRES_USER: rideshare_user
      POSTGRES_PASSWORD: rideshare_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rideshare_network

  # Redis - Caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: rideshare_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - rideshare_network

  # MongoDB - Document storage
  mongodb:
    image: mongo:7
    container_name: rideshare_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: rideshare_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - rideshare_network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  rideshare_network:
    driver: bridge
